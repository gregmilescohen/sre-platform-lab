global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        service: pulseboard-api
      receiver: sre-agent-webhook
      continue: true

receivers:
  - name: default

  - name: sre-agent-webhook
    webhook_configs:
      - url: http://sre-agent:8090/webhook
        send_resolved: true
